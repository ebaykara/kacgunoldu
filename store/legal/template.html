<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}} — {{brand}}</title>
  <meta name="description" content="{{description}}" />
  <meta name="theme-color" content="#FBF5F0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#171412" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/kacgunoldu/icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/kacgunoldu/icon.png" />
  <link rel="canonical" href="{{canonical}}" />
{{hreflang}}
  <meta property="og:title" content="{{title}} — {{brand}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:image" content="https://emalabs.info/kacgunoldu/og.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/kacgunoldu/site.css" />
</head>
<body class="legal">

{{header}}

  <main>
    <section class="doc-hero">
      <div class="hero-glow" aria-hidden="true"></div>
      <div class="wrap">
        <nav class="crumbs" aria-label="breadcrumb">
          <a href="{{home_path}}">{{brand}}</a><span aria-hidden="true">/</span><span>{{badge}}</span>
        </nav>
        <h1 class="display">{{h1}}</h1>
        <div class="doc-meta">
{{chips}}
        </div>
        <nav class="doc-tabs" aria-label="{{brand}}">
{{tabs}}
        </nav>
      </div>
    </section>

    <div class="wrap doc-layout">
      <aside class="toc">
        <h4>{{toc_title}}</h4>
        <ol>
{{toc}}
        </ol>
      </aside>
      <article class="doc">
{{lead}}
{{sections}}
      </article>
    </div>
  </main>

{{footer}}

  <script src="/kacgunoldu/site.js" defer></script>
</body>
</html>

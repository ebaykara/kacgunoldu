# Codemagic — Kaç Gün Oldu?
#
# iOS → TestFlight / App Store is the first target. The Android workflow is
# there for later (Play Console) and can be ignored until then.
#
# One-time setup (Codemagic UI → Teams → Integrations):
#   1. Integration: the team's existing App Store Connect integration, named
#      `Codemagic`, is used (Teams → Integrations). Change the name below if
#      yours differs.
#   2. In App Store Connect create the app record with bundle id
#      `com.emalabs.kacgunoldu`; its numeric "Apple ID" goes into the env var
#      APP_STORE_APPLE_ID (Codemagic → app → Environment variables, group
#      `appstore`, or just replace the value below).
#   3. Push this repo, add it in Codemagic, choose "codemagic.yaml".
#   4. Signing: the certificate and the App Store profile are created through the
#      API key by the "Set up code signing" step. The private key comes from the
#      this app's own secure variable CERTIFICATE_PRIVATE_KEY (Codemagic → app →
#      Environment variables; base64 of the PEM or the PEM itself).

definitions:
  flutter_version: &flutter_version stable

workflows:
  ios-app-store:
    name: iOS · App Store
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: *flutter_version
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.emalabs.kacgunoldu
        # Numeric Apple ID of the app in App Store Connect (App Information).
        APP_STORE_APPLE_ID: "6813693710"
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze and test
        script: |
          flutter analyze
          flutter test
      - name: Set up code signing
        # Creates the distribution certificate and the App Store profile through
        # the App Store Connect API key when they don't exist yet.
        # CERTIFICATE_PRIVATE_KEY: secure env var, see the header.
        script: |
          set -ex
          keychain initialize
          # The key is stored base64-encoded (a multi-line PEM breaks in env vars).
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "HATA: CERTIFICATE_PRIVATE_KEY tanimli degil (uygulamanin Environment variables bolumune ekle)."
            exit 1
          fi
          # Accepts the raw PEM as well as its base64 form.
          case "$CERTIFICATE_PRIVATE_KEY" in
            "-----BEGIN"*) echo "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem ;;
            *) echo "$CERTIFICATE_PRIVATE_KEY" | openssl base64 -d -A > /tmp/cert_key.pem ;;
          esac
          test -s /tmp/cert_key.pem
          app-store-connect fetch-signing-files "$BUNDLE_ID"             --type IOS_APP_STORE             --certificate-key=@file:/tmp/cert_key.pem             --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build IPA
        script: |
          # The build number always grows: the highest one App Store Connect
          # (TestFlight) knows, plus one. The version name comes from pubspec.
          BUILD_NUMBER=$(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID") + 1))
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        # Goes to TestFlight; submit for review from App Store Connect.
        submit_to_testflight: true
        submit_to_app_store: false

  android-play:
    name: Android · Play Store
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      flutter: *flutter_version
      java: 17
      android_signing:
        # Codemagic → Teams → Code signing identities → Android keystores:
        # upload kacgunoldu-upload.jks, reference name below.
        - kacgunoldu_upload
      vars:
        PACKAGE_NAME: com.emalabs.kacgunoldu
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "android-v*"
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze and test
        script: |
          flutter analyze
          flutter test
      - name: Write key.properties from the Codemagic keystore
        script: |
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Build app bundle
        script: |
          flutter build appbundle --release \
            --build-number=$(($(date +%s) / 60 - 29000000))
    artifacts:
      - build/app/outputs/bundle/release/*.aab
